name: Parse subscriptions

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: parser
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cores
        uses: actions/cache@v4
        with:
          path: cores
          key: cores-${{ runner.os }}-v1

      - name: Run parser
        run: python parser.py

      - name: Commit results
        run: |
          git config user.name "sub-parser"
          git config user.email "actions@users.noreply.github.com"
          git add output data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
