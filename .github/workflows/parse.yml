name: parse-subscriptions

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/**'

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install xray
        run: |
          bash -c "$(curl -fsSL https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

      - name: Install sing-box
        run: |
          set -euo pipefail
          VER=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
                | grep -oP '"tag_name":\s*"v\K[^"]+' | head -1)
          curl -fsSLo /tmp/sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          sudo install -m 755 "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version
          xray version

      - name: Parse + check
        run: |
          cd parser
          python main.py --configs ../configs --mode deep --out ../out --workers 6

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parse-report
          path: out/
          retention-days: 14
